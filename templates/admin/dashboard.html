{% extends "base.html" %}

{% block title %}管理仪表盘 - 个人博客{% endblock %}

{% block content %}
<div class="admin-header">
    <h2>文章管理</h2>
    <a href="{{ url_for('new_article') }}" class="btn btn-primary">+ 添加新文章</a>
</div>

<div class="articles-table">
    <table>
        <thead>
            <tr>
                <th>文章标题</th>
                <th>发布日期</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% if articles %}
                {% for article in articles %}
                <tr>
                    <td>{{ article.title }}</td>
                    <td>{{ article.date }}</td>
                    <td class="actions">
                        <a href="{{ url_for('show_article', article_id=article.id) }}" class="btn btn-view">查看</a>
                        <a href="{{ url_for('edit_article', article_id=article.id) }}" class="btn btn-edit">编辑</a>
                        <form action="{{ url_for('delete_article_route', article_id=article.id) }}" method="POST" class="delete-form" onsubmit="return confirm('确定要删除这篇文章吗？');">
                            <button type="submit" class="btn btn-delete">删除</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="3">暂无文章</td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</div>
{% endblock %}
