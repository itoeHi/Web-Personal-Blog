{% extends "base.html" %}

{% block title %}新建文章 - 个人博客{% endblock %}

{% block content %}
<div class="form-container">
    <h2>新建文章</h2>
    
    <form method="POST" action="{{ url_for('new_article') }}">
        <div class="form-group">
            <label for="title">文章标题</label>
            <input type="text" id="title" name="title" placeholder="请输入文章标题" required>
        </div>
        
        <div class="form-group">
            <label for="date">发布日期</label>
            <input type="date" id="date" name="date" value="{{ now.strftime('%Y-%m-%d') }}" required>
        </div>
        
        <div class="form-group">
            <label for="content">内容</label>
            <textarea id="content" name="content" rows="15" placeholder="请输入文章内容..." required></textarea>
            <small class="form-text">支持HTML标签和基本Markdown语法</small>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">发布文章</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
